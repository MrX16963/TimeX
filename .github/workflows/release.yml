name: Build and publish TimeX apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag for the new downloadable release (for example v1.0.5)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Select release version
        id: release
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_name="${GITHUB_REF_NAME}"
          else
            tag_name="$INPUT_RELEASE_TAG"
          fi
          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][[:alnum:].-]+)?$ ]]; then
            echo "Enter a valid release version, such as v1.0.5." >&2
            exit 1
          fi
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

  build-windows:
    runs-on: windows-latest
    needs: release-info
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set Windows app version to the release version
        shell: pwsh
        env:
          TIMEX_RELEASE_TAG: ${{ needs.release-info.outputs.tag_name }}
        run: |
          $version = $env:TIMEX_RELEASE_TAG.TrimStart("v")
          npm version $version --no-git-tag-version --allow-same-version
      - name: Build Windows installer and portable app
        run: npm run build:windows
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: timex-windows
          path: release-output/windows/*.exe
          if-no-files-found: error
          retention-days: 14

  build-android:
    runs-on: ubuntu-latest
    needs: release-info
    steps:
      - name: Verify persistent Android signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository secret: $name. Android releases must use the persistent signing key." >&2
              exit 1
            fi
          done
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/timex-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/timex-release.p12" >> "$GITHUB_ENV"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Install dependencies
        run: npm ci
      - name: Build Android app
        env:
          VITE_BASE_PATH: ./
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:native
      - name: Enable Gradle wrapper
        working-directory: android
        run: chmod +x gradlew
      - name: Build installable Android APK
        working-directory: android
        env:
          TIMEX_VERSION_CODE: ${{ github.run_number }}
          TIMEX_VERSION_NAME: ${{ needs.release-info.outputs.tag_name }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/timex-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease "-PtimexVersionCode=$TIMEX_VERSION_CODE" "-PtimexVersionName=$TIMEX_VERSION_NAME"
      - name: Verify Android APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk"
      - name: Verify Android update signing key
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          fingerprint="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/ { print tolower($2); exit }')"
          expected="dd91b936612695469445b1e21c5914c805b828e824699e107639b91c35130771"
          if [[ "$fingerprint" != "$expected" ]]; then
            echo "APK signer changed; refusing to publish an Android update that cannot replace the installed app." >&2
            exit 1
          fi
      - name: Prepare GitHub download
        run: |
          mkdir -p release-output/android
          cp android/app/build/outputs/apk/release/app-release.apk release-output/android/TimeX-Android.apk
      - name: Upload Android download
        uses: actions/upload-artifact@v4
        with:
          name: timex-android
          path: release-output/android/TimeX-Android.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    runs-on: ubuntu-latest
    needs:
      - release-info
      - build-windows
      - build-android
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: timex-*
          path: release-output
          merge-multiple: true
      - name: Publish GitHub Release downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-info.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: TimeX ${{ needs.release-info.outputs.tag_name }}
          body: |
            Download TimeX for Windows or Android:

            - **Windows installer:** `TimeX-nsis-x64.exe`
            - **Windows portable:** `TimeX-Portable-x64.exe`
            - **Android app:** `TimeX-Android.apk`

            Android releases use the persistent TimeX signing key, so future releases can be installed over the existing app while preserving local data. Versions before the first persistently signed release used a temporary debug key and require a one-time uninstall to switch signing keys; export or sync device-only data first.

            Windows and Android may display a warning because these direct-download builds are not distributed through their app stores.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-output/TimeX-nsis-x64.exe
            release-output/TimeX-Portable-x64.exe
            release-output/TimeX-Android.apk
