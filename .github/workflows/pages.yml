name: Deploy TimeX website

on:
  push:
    branches:
      - mrx16963-timex-productivity-app
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare the direct Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(gh api repos/MrX16963/TimeX/releases/latest --jq .tag_name)"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][[:alnum:].-]+)?$ ]]; then
            echo "Could not determine the latest TimeX release tag." >&2
            exit 1
          fi
          echo "VITE_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          mkdir -p public/downloads
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "https://github.com/MrX16963/TimeX/releases/download/$release_tag/TimeX-Android.apk" \
            --output public/downloads/TimeX-Android.apk
      - name: Build website
        run: npm run build
        env:
          VITE_BASE_PATH: /TimeX/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
